name: Beach calibration tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: OPENBLAS_NUM_THREADS=1 python -m pytest -q
      - run: OPENBLAS_NUM_THREADS=1 python experiment.py --no-plot
